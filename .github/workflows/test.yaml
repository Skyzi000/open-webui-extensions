name: Test Extensions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly check for Open WebUI compatibility
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      open_webui_branch:
        description: "Open WebUI version to test against"
        type: choice
        default: "main"
        options:
          - "pinned"  # Use submodule commit
          - "main"
          - "dev"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Update Open WebUI to latest
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.open_webui_branch != 'pinned')
        run: |
          cd references/open-webui
          BRANCH="${{ inputs.open_webui_branch || 'main' }}"
          git fetch origin "$BRANCH"
          git checkout "origin/$BRANCH"
          echo "Updated to Open WebUI $BRANCH:"
          git log -1 --format='%H %s (%ci)'

      - name: Fetch pinned Open WebUI v0.9.6 compatibility commit
        run: git -C references/open-webui fetch --depth=1 origin 1a97751e376e00a1897bc3679215ae1c7bd8fd42

      - name: Install dependencies
        # open-webui itself is skipped: installing it runs its build backend,
        # whose frontend build (npm) OOMs on CI runners. Tests import Core
        # from references/open-webui/backend via tests/conftest.py instead.
        run: uv sync --extra test --group dev --no-install-package open-webui

      - name: Run all tests
        # No path argument: `testpaths` in pyproject.toml drives discovery
        # (currently `tests/` + `open_webui_plugins_builder/tests/`).
        # Passing an explicit path here would silently shadow `testpaths`
        # and skip whichever directory wasn't named.
        # --no-sync: a bare `uv run` re-syncs the environment and would try
        # to install the skipped open-webui package, hitting the same OOM.
        run: uv run --no-sync pytest -v --tb=short
        env:
          ENV: dev
          WEBUI_SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite:///./test.db
          ENABLE_OLLAMA_API: "false"
          ENABLE_OPENAI_API: "false"

      - name: Report Open WebUI version
        run: |
          cd references/open-webui
          echo "Open WebUI commit: $(git rev-parse HEAD)"
          echo "Open WebUI date: $(git log -1 --format=%ci)"
